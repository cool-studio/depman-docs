name: Site

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by cool-studio/depman when a release tag is pushed, and by hand
  # to publish depman docs changes between releases. See README.md.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      depman-commit: ${{ steps.depman.outputs.commit }}
    steps:
      - name: Check DEPMAN_READ_TOKEN
        env:
          DEPMAN_READ_TOKEN: ${{ secrets.DEPMAN_READ_TOKEN }}
        run: |
          if [ -z "$DEPMAN_READ_TOKEN" ]; then
            echo "::error title=Missing secret DEPMAN_READ_TOKEN::Add a fine-grained PAT with Contents: read on cool-studio/depman as the repository secret DEPMAN_READ_TOKEN. See README.md."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check out cool-studio/depman (read-only)
        id: depman
        uses: actions/checkout@v7
        with:
          repository: cool-studio/depman
          token: ${{ secrets.DEPMAN_READ_TOKEN }}
          path: .depman
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Pull content from depman
        run: ./scripts/pull-content.sh --from .depman

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::Add $name as a repository secret to deploy to Cloudflare Pages. See README.md."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPMAN_COMMIT: ${{ needs.build.outputs.depman-commit }}
        run: >-
          npx --yes wrangler@4.131.2 pages deploy build
          --project-name=depman-site
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-message="site ${GITHUB_SHA::7}, depman ${DEPMAN_COMMIT::7} ($GITHUB_EVENT_NAME)"
